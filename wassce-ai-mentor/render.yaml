services:
  - type: web
    name: wassce-ai-mentor-api
    runtime: python
    region: frankfurt
    plan: free
    branch: master
    rootDir: wassce-ai-mentor
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python scripts/init_db.py
      python scripts/ingest.py --reset
    startCommand: PYTHONPATH=. uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_store
      - key: CHROMA_COLLECTION_NAME
        value: wassce_qa
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SHORTCODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false

  # React performance dashboard (Phase 1) — static site, separate service.
  # Builds dashboard-react/ with Vite and serves the compiled dist/ folder.
  # NOTE: the local YAML schema used by some editors does not recognise
  # Render's static-site fields (runtime: static / staticPublishPath / routes)
  # and may show lint errors here — that is a stale editor schema, not a
  # Render error. If the Blueprint sync still rejects this block on your
  # Render account, create the service manually instead: see the exact
  # manual settings documented in dashboard-react/README.md.
  - type: web
    name: wassce-ai-mentor-react
    runtime: static
    region: frankfurt
    branch: master
    rootDir: dashboard-react
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://wassce-ai-mentor-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: wassce-ai-mentor-dashboard
    runtime: python
    region: frankfurt
    plan: free
    branch: master
    rootDir: wassce-ai-mentor
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: PYTHONPATH=. streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_store
      - key: CHROMA_COLLECTION_NAME
        value: wassce_qa
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DASHBOARD_PASSWORD
        sync: false
